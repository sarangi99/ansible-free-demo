---
- hosts: webapps
  become: yes
  gather_facts: yes
  tasks:
    - name: install apache2 on debian
      apt:
        name: apache2
        state: present 
      when: ansible_os_family == "Debian"

    - name: start apache2 on debian
      service:
        name: apache2
        state: started
        enabled: yes
      when: ansible_os_family == "Debian"